name = "theslowswing"
account_id = "cc91a84e03ba8f3eae482a9a8a8fe36e"
compatibility_date = "2025-09-01"
main = "worker.js"

# Dead-man check: 01:00 UTC = 9pm EDT / 8pm EST, Tue-Sat UTC = Mon-Fri evenings ET.
# Fires the `scheduled` handler in worker.js, which emails NOTIFY_EMAIL if
# board:current in KV is not stamped with today's session.
[triggers]
# Days are spelled out on purpose: Cloudflare numbers the week 1-7 starting at SUNDAY
# (standard cron starts at 0), so "1-5" here meant Sun-Thu — the kick never fired on
# Fridays (2026-10-30, 2026-11-06) and fired on Sunday 2026-11-01. Found 2026-11-07.
crons = ["0 1 * * TUE-SAT", "25 21 * * MON-FRI", "25 22 * * MON-FRI"]   # dead-man 9pm ET (Tue-Sat UTC = Mon-Fri evenings ET); nightly kick 5:25pm ET (EDT slot, EST slot)

[assets]
directory = "./site"
binding = "ASSETS"

[vars]
APP_URL = "https://theslowswing.com"
EMAIL_FROM = "The Slow Swing <hello@theslowswing.com>"   # root domain verified in Resend 2026-10-13; was hello@send.theslowswing.com
NOTIFY_EMAIL = "gjv1000@gmail.com"
TG_CHAT = "6499078442"      # Telegram chat id for ❌ alerts from the worker (the bot token stays a secret). Was missing until 2026-10-31, so kick failures were silent.
# Complimentary full-access accounts (comma-separated, no trial, no card). Owner first.
COMP_EMAILS = "gjv1000@gmail.com"
# Journal announcements (POST /api/announce). Sender must be a Resend-verified
# domain: verify theslowswing.com in Resend before the first real send, or
# comment this line out to fall back to EMAIL_FROM (send.theslowswing.com).
# ANNOUNCE_FROM = "The Slow Swing <hello@theslowswing.com>"

# Stripe LIVE price IDs (acct_1UCn8TDl0kTLe9eM, product prod_VDDkspzAgZss56).
# Price IDs are not secrets. The secret key goes in via: wrangler secret put STRIPE_SECRET_KEY
STRIPE_PRICE_MONTHLY  = "price_1UHpvRDl0kTLe9eMmc5YRw7r"   # $15 / month  (2026-09-20; old $20 = price_1UEHODDl0kTLe9eMrVkCJY9D, archived)
STRIPE_PRICE_ANNUAL   = "price_1UHpwoDl0kTLe9eM6yq1lWWC"   # $120 / year (2026-09-20; old $180 = price_1UEHODDl0kTLe9eMVUxgJGyd, archived)
STRIPE_PRICE_FOUNDERS = "price_1UHpxcDl0kTLe9eMUyIkoFuI"   # $80 / year  (2026-09-20; old $90 = price_1UEHOCDl0kTLe9eMoFdbSgP4, archived)

# Created by: wrangler kv namespace create STORE
# Paste the id it prints in place of PASTE_KV_ID_HERE
[[kv_namespaces]]
