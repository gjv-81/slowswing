name: nightly

# The Slow Swing nightly on GitHub's runners (replaces the Mac cron/launchd).
#
# Two UTC slots so the run lands after the US close all year without editing
# for daylight saving: 21:40 UTC = 17:40 EDT / 16:40 EST, 22:40 UTC = 18:40 EDT
# / 17:40 EST. The guard step only lets the run through when it is past
# 17:30 New York time; run_nightly_ci.sh then skips itself if tonight's
# session was already processed, so the second slot is a free retry.
#
# Repo variables (Settings → Secrets and variables → Actions → Variables):
#   PUBLISH          "0" = shadow (default), "1" = live
#   STS_FORCE_YAHOO  "1" = no Marketstack at all (billing freeze), else unset/"0"
# Repo secrets:
#   MARKETSTACK_API_KEY  TG_TOKEN  TG_CHAT  CLOUDFLARE_API_TOKEN
#   R2_ACCOUNT_ID  R2_ACCESS_KEY_ID  R2_SECRET_ACCESS_KEY

on:
  schedule:
    - cron: "40 21 * * 1-5"
    - cron: "40 22 * * 1-5"
  workflow_dispatch:
    inputs:
      publish:
        description: "1 = publish to the site (live), 0 = shadow"
        default: "0"
      force_run:
        description: "1 = run even if tonight's session was already processed"
        default: "0"

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: write          # push-back of the state files in live mode

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: America/New_York
    steps:
      - name: Guard — only after 17:30 New York time (manual runs always pass)
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          H=$(date +%H); M=$(date +%M)
          if [ "$H$M" -ge 1730 ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "go=0" >> "$GITHUB_OUTPUT"; echo "too early in New York ($H:$M), skipping"; fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.go == '1'
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.go == '1'
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.go == '1'
        with:
          node-version: "20"
          cache: npm

      - name: Install
        if: steps.guard.outputs.go == '1'
        run: |
          pip install -r requirements.txt
          npm ci --no-audit --no-fund
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          rclone version | head -1

      - name: Run the nightly
        if: steps.guard.outputs.go == '1'
        env:
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish || vars.PUBLISH || '0' }}
          FORCE_RUN: ${{ github.event.inputs.force_run || '0' }}
          STS_FORCE_YAHOO: ${{ vars.STS_FORCE_YAHOO || '0' }}
          EOD_PROVIDER: marketstack
          MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: sts-state
        run: bash run_nightly_ci.sh

      - name: Keep the logs
        if: always() && steps.guard.outputs.go == '1'
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: |
            evening.log
            v2_evening.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Telegram if the job itself crashed
        if: failure() && steps.guard.outputs.go == '1'
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          [ -n "$TG_TOKEN" ] || exit 0
          curl -sS -m 20 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=❌ CI nightly workflow FAILED (runner-level). GitHub → Actions → nightly → run ${{ github.run_id }}" >/dev/null || true
