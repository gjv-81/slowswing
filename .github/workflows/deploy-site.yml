name: deploy-site

# Publishes the website + worker whenever a push to main touches them, so a
# copy change from any chat goes live with a `git push` — no laptop, no
# deploy_site.sh by hand. The member board (KV) is NOT touched here; that is
# the nightly's job.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "worker.js"
      - "wrangler.toml"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # the nightly's own push-back commits touch site/teaser.json etc.; it has
    # already deployed, so skip those to avoid a second identical deploy
    if: "!contains(github.event.head_commit.message, '(CI)')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Version stamp (the page reloads itself when this changes)
        run: printf '{"v":"%s"}\n' "$(date -u +%Y%m%dT%H%M%SZ)" > site/version.json
      - name: Never ship the gated board as a public asset
        run: rm -f site/board.json
      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
